[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-agent"
version = "0.1.0"
description = "Evidence-first foreign-trade intelligence agent"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
runtime = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "huggingface-hub==0.28.1",
    "langgraph==1.2.11",
    "numpy>=2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "Pillow>=12.3,<13",
    "pymilvus==2.6.17",
    "pymysql>=1.1,<2",
    "pymupdf>=1.24,<2",
    "pypdf>=5,<6",
    "pyyaml>=6.0,<7",
    "reportlab>=4.2,<5",
    "rank-bm25==0.2.2",
    "sqlalchemy>=2.0,<3",
    "sqlglot==30.18.0",
    "sentence-transformers==3.4.1",
    "torch==2.6.0",
    "transformers==4.48.3",
    "langgraph-checkpoint-redis>=0.5.2",
    "uvicorn>=0.30,<1",
]
dev = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]
integration = [
    "redis>=5,<6",
]

[project.scripts]
trade-intel = "trade_agent.cli:main"

[tool.setuptools.packages.find]
include = ["trade_agent*", "scripts*"]

[tool.setuptools.package-data]
"trade_agent.index" = ["bge_m3_artifact_manifest.json"]
"trade_agent.config" = ["schema_registry.yaml", "retrieval_profiles.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external service dependencies",
    "milvus: requires a Milvus service",
    "e2e: end-to-end workflow tests",
    "model: downloads and loads a real pinned model",
]
